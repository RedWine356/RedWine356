name: Refresh profile

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]
    paths: [profile.json, build.py]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with live stats
        run: python build.py --live
        env:
          # PROFILE_TOKEN (optional secret) lets streaks include private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile"
          git push
